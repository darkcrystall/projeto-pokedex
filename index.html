<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokédex</title>
    <link
      rel="shortcut icon"
      href="./assets/images/favicon.png"
      type="image/x-icon"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="./assets/styles/index.css" />
  </head>
  <body>
    <main>
      <!-- imagem do pokémon exibido -->
      <img src="#" alt="Pokémon" class="imagem_pokemon" />
      <!-- exibição do número e nome do pokémon -->
      <h1 class="dados_pokemon">
        <span class="numero_pokemon"></span> -
        <span class="nome_pokemon"></span>
      </h1>
      <!-- formulário da busca para procurar um pokémon por nome ou número-->
      <form class="formulario">
        <input
          type="search"
          class="campo_busca"
          placeholder="Nome ou Número"
          required
        />
      </form>
      <!-- botões para navegar entre os pokémons -->
      <div class="botoes">
        <button class="botao botao_anterior">Anterior &lt;</button>
        <button class="botao botao_proximo">Próximo &gt;</button>
      </div>
      <!-- imagem do pokedex -->
      <img src="assets/images/pokedex.png" alt="pokedex" class="pokedex" />
    </main>
    <script src="./assets/scripts/index.js"></script>
  </body>
</html>
